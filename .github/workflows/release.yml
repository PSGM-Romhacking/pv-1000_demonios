# On a version tag (v1.0.0…), builds the three ROMs, checks the CRC32s and attaches the zips to the release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y z80asm python3-yaml python3-pil python3-numpy
      - run: make check dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/demonios_pt.zip
            build/demonios_en.zip
            build/demonios_es.zip
