# Demônios: English text. Only the text: scenes, conditions and effects live in
# demonios.yaml (see src/tools/languages.py). Options: at most 26 columns.

game:
  title: DEMÔNIOS
  subtitle: after the story by Aluísio Azevedo (1893)
  about: |
    Aluísio Azevedo was born in São Luís, in northern Brazil, in 1857, and died in Buenos Aires in 1913.
    ---
    Before becoming a writer, he drew caricatures for the newspapers of Rio de Janeiro. With O Mulato (1881) and O Cortiço (1890), he became the leading name of Brazilian naturalism.
    ---
    Demônios came out in 1893, in a book of short stories. In it, the author of novels of manners imagines the end of the world seen from a boarding-house room in Rio.
    ---
    He was one of the founders of the Brazilian Academy of Letters and, from 1895, served as Brazil's consul in several countries.

